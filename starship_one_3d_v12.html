<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Starship One – Warbird V1.2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b10;color:#cdebdc;font:14px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:16px;left:18px;pointer-events:none;text-shadow:0 2px 10px #000}header strong{font-size:20px;letter-spacing:.17em}header small{display:block;margin-top:7px;opacity:.7}footer{position:absolute;bottom:16px;width:100%;text-align:center;pointer-events:none;opacity:.7}</style></head><body><header><strong>STARSHIP ONE</strong><small>V1.1 · EINTEILIGES HECK</small></header><footer>Mit einem Finger drehen · Mit zwei Fingern zoomen</footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030b10);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,700);camera.position.set(28,19,-33);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=17;controls.maxDistance=95;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0x8bbfb2,0x0a171b,2.4));
const a=new THREE.DirectionalLight(0xe8ffef,3.5);a.position.set(-14,25,-15);scene.add(a);
const b=new THREE.DirectionalLight(0x21e5ac,2.2);b.position.set(15,-9,18);scene.add(b);
const metal=new THREE.MeshStandardMaterial({color:0x45695f,metalness:.72,roughness:.31,side:THREE.DoubleSide});
const dark=new THREE.MeshStandardMaterial({color:0x16332f,metalness:.78,roughness:.33,side:THREE.DoubleSide});
const ridge=new THREE.MeshStandardMaterial({color:0x77998a,metalness:.8,roughness:.24,side:THREE.DoubleSide});
const light=new THREE.MeshStandardMaterial({color:0x5affbc,emissive:0x00df87,emissiveIntensity:3.2});
const ship=new THREE.Group();scene.add(ship);
// Each wing is a single, smoothly varying loft surface with a rounded outer edge.
// Both upper and lower wing decks are part of a recognizable D'deridex-inspired double-hull design.
// Z negative = bow, positive = stern.
// The entire aft fuselage and BOTH wings are a SINGLE continuous solid mesh.
// No overlapping wing panels, wing roots, aft ellipsoids or glued-on pods.
// A unified outline flows from the stern outward into long swept-forward tips.
const right=[
 [0,13.1],[3.8,12.6],[6.8,11.2],[10.2,8.6],[13.4,4.4],
 [16.2,-1.0],[17.9,-7.6],[18.4,-12.6], // sharp forward-pointing tip
 [16.8,-11.2],[15.1,-7.4],[13.2,-3.2],[10.4,1.3],
 [7.1,4.5],[4.1,5.6],[2.5,4.6],[2.1,1.4],[1.8,-3.1],
 [1.3,-7.8],[0,-10.0]
];
const perimeter=[...right,...right.slice(1,-1).reverse().map(([x,z])=>[-x,z])];
// Curved closed Catmull-Rom perimeter: preserves the proven silhouette,
// but removes the straight polygon edges and angular wing roots.
const path=new THREE.CatmullRomCurve3(perimeter.map(([x,z])=>new THREE.Vector3(x,-z,0)),true,'centripetal');
const outline=new THREE.Shape();
const samples=path.getSpacedPoints(perimeter.length*14);
outline.moveTo(samples[0].x,samples[0].y);
for(let i=1;i<samples.length;i++)outline.lineTo(samples[i].x,samples[i].y);
outline.closePath();
// Higher bevel subdivisions create rounded edges instead of a slab-like extrusion.
const solid=new THREE.ExtrudeGeometry(outline,{depth:1.7,steps:4,bevelEnabled:true,bevelThickness:.64,bevelSize:.48,bevelSegments:12,curveSegments:24});
solid.rotateX(-Math.PI/2);
const attr=solid.attributes.position;
for(let i=0;i<attr.count;i++){
 const x=attr.getX(i),y=attr.getY(i),z=attr.getZ(i);
 // The aft breast is a continuous elevation OF THE SAME HULL SURFACE.
 // It gradually fades as the wings spread, giving organic transitions.
 const rise=2.05*Math.exp(-Math.pow(x/7.8,2)-Math.pow((z-5.1)/8.4,2));
 const spread=Math.max(0,Math.min(1,(Math.abs(x)-4)/13));
 const droop=-1.0*(spread*spread*(3-2*spread));
 attr.setY(i,y+rise+droop);
}
solid.computeVertexNormals();
const rearHull=new THREE.Mesh(solid,metal);ship.add(rearHull);
// A slender forward nose is visually blended into the unified rear silhouette.
function ell(x,y,z,sx,sy,sz,mat){const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),mat);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);ship.add(mesh);return mesh}
ell(0,0,-7.8,1.65,.9,4.4,metal);
ell(0,.65,-10.2,.8,.26,1.75,dark);
// Thin illuminated surface inlays; they are not structural wing pieces.
function tube(points,r,mat){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,80,r,8,false),mat);ship.add(mesh)}
for(const side of [-1,1]){
 tube([[side*4.5,2.2,10.7],[side*9,1.6,7.6],[side*13.3,.7,3.1],[side*16.2,-.6,-4.5],[side*17.6,-.8,-10.9]],.065,light);
}
// Nose bridge and rear luminous engine line

ell(0,1.9,12.4,1.7,.24,.16,light);
const stars=new THREE.BufferGeometry(),positions=[];for(let i=0;i<1800;i++){let r=100+Math.random()*220,a=Math.random()*Math.PI*2,z=Math.random()*2-1,v=Math.sqrt(1-z*z);positions.push(r*v*Math.cos(a),r*z,r*v*Math.sin(a))}stars.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xa3c4c4,size:.45,sizeAttenuation:false})));
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
