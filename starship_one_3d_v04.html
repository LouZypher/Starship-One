<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Starship One – 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#030814;color:#e9f4ff;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}.hud{position:absolute;top:16px;left:16px;pointer-events:none;text-shadow:0 2px 8px #000}.hud strong{font-size:22px;letter-spacing:3px}.hud small{display:block;color:#89bbd4;margin-top:6px}.hint{position:absolute;bottom:18px;left:0;width:100%;text-align:center;color:#a9c5d8;pointer-events:none}.badge{color:#6fe2fa}
</style></head><body><div class="hud"><strong>STARSHIP <span class="badge">ONE</span></strong><small>EXPLORER CLASS · NX-01 · AUSSENANSICHT</small></div><div class="hint">Mit Finger drehen · Mit zwei Fingern zoomen</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030814);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,1500);camera.position.set(23,18,30);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa6dfff,0x0b1425,2.2));let sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-12,24,18);scene.add(sun);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.055;controls.minDistance=12;controls.maxDistance=95;controls.target.set(0,0,0);
const ship=new THREE.Group();scene.add(ship);
const hull=new THREE.MeshStandardMaterial({color:0xb3c7d7,metalness:.78,roughness:.27}),dark=new THREE.MeshStandardMaterial({color:0x26394c,metalness:.8,roughness:.28}),accent=new THREE.MeshStandardMaterial({color:0x0c759d,metalness:.5,roughness:.3,emissive:0x064b6a,emissiveIntensity:.5}),glow=new THREE.MeshStandardMaterial({color:0x70e8ff,emissive:0x27bbff,emissiveIntensity:2,roughness:.2}),red=new THREE.MeshStandardMaterial({color:0xff9472,emissive:0xff5429,emissiveIntensity:2});
function mesh(g,m,x=0,y=0,z=0,parent=ship){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);parent.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,seg=64){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m,x,y,z)}
function rod(a,b,r,mat){let v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),d=v2.clone().sub(v1);let o=mesh(new THREE.CylinderGeometry(r,r,d.length(),14),mat,...v1.clone().add(v2).multiplyScalar(.5).toArray());o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o}
// Forward is negative Z. Sleek flattened saucer, inset luminous edge and raised bridge.
let disk=mesh(new THREE.SphereGeometry(1,64,24),hull,0,0,-7);disk.scale.set(9,1.12,7.7);
let rim=mesh(new THREE.TorusGeometry(8.38,.14,12,100),glow,0,-.12,-7);rim.rotation.x=Math.PI/2;rim.scale.y=.92;
let upper=cyl(2.1,3.4,.55,dark,0,1.03,-7.4);let bridge=mesh(new THREE.SphereGeometry(1,32,16),accent,0,1.45,-8);bridge.scale.set(1.7,.55,1.35);
let viewport=mesh(new THREE.TorusGeometry(1.18,.065,8,48),glow,0,1.57,-8);viewport.rotation.x=Math.PI/2;
let spine=mesh(new THREE.CylinderGeometry(1.45,1.9,11,16),hull,0,-.65,2.3);spine.rotation.x=Math.PI/2;
let reactor=mesh(new THREE.SphereGeometry(1,32,24),hull,0,-1,5.7);reactor.scale.set(3.2,2.3,5.1);
let belly=mesh(new THREE.SphereGeometry(1,32,24),dark,0,-1.9,5.8);belly.scale.set(2.2,1.05,3.5);
let deflector=cyl(1.45,1.65,.18,glow,0,-1,10.3);deflector.rotation.x=Math.PI/2;
for(const s of [-1,1]){
// Broad, downward-sloping swept pylons; nacelles sit distinctly below the engineering hull.
const pylonShape=new THREE.BufferGeometry();
const A=[[s*1.8,-.55,3.2],[s*3.2,-.75,7.9],[s*9.0,-3.15,7.2],[s*9.0,-3.15,3.5]];
const B=A.map(([x,y,z])=>[x,y-.34,z]);
const verts=[...A,...B].flat();
const faces=[0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,1,5,6,1,6,2,2,6,7,2,7,3,3,7,4,3,4,0];
pylonShape.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));pylonShape.setIndex(faces);pylonShape.computeVertexNormals();
mesh(pylonShape,new THREE.MeshStandardMaterial({color:0x829fb2,metalness:.78,roughness:.27,side:THREE.DoubleSide}));
const nac=mesh(new THREE.CylinderGeometry(1.12,1.34,12.8,8),hull,s*9.0,-3.6,3.2);nac.rotation.x=Math.PI/2;nac.scale.set(1.25,.66,1);
const cap=mesh(new THREE.SphereGeometry(1,24,16),red,s*9.0,-3.6,-3.25);cap.scale.set(1.35,.7,.46);
const end=mesh(new THREE.SphereGeometry(1,24,16),glow,s*9.0,-3.6,9.7);end.scale.set(1.13,.62,.38);
mesh(new THREE.BoxGeometry(.18,.14,10.4),glow,s*9.0,-2.77,3.2);
for(let i=0;i<5;i++)mesh(new THREE.BoxGeometry(.2,.12,.7),accent,s*9.0,-2.68,-1.1+i*1.9);
}
for(let i=0;i<18;i++){let a=i*Math.PI*2/18;let light=mesh(new THREE.SphereGeometry(.09,8,8),glow,8.55*Math.cos(a),.13,-7+7.1*Math.sin(a));}
let starsG=new THREE.BufferGeometry(),pos=[];for(let i=0;i<1300;i++){let r=130+Math.random()*450,t=Math.random()*Math.PI*2,u=Math.acos(2*Math.random()-1);pos.push(r*Math.sin(u)*Math.cos(t),r*Math.cos(u),r*Math.sin(u)*Math.sin(t))}starsG.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));scene.add(new THREE.Points(starsG,new THREE.PointsMaterial({color:0xc9e7ff,size:.75,sizeAttenuation:false})));
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
