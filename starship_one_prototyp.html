<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Starship One – Prototyp</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101e;color:#e4f2ff;font:14px system-ui}header{padding:12px;background:#111f35;display:flex;justify-content:space-between;align-items:center}h2{margin:0;font-size:19px}button{background:#21466b;color:white;border:1px solid #47799d;border-radius:7px;padding:9px;cursor:pointer}button:disabled{opacity:.35}.stats{display:flex;gap:12px;overflow:auto;padding:10px;background:#0d1929;white-space:nowrap}.layout{display:grid;grid-template-columns:1fr 300px;gap:10px;padding:10px}.view{position:relative;min-height:490px;background:radial-gradient(ellipse,#1b324b,#060b15);border:1px solid #36506b;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:490px;touch-action:none}.side{background:#101f32;padding:12px;border-radius:12px}.side button{margin:3px}.small{font-size:12px;color:#a7c3d8}#log{max-height:125px;overflow:auto;font-size:12px}#crew{max-height:190px;overflow:auto}.crew{padding:5px;border-bottom:1px solid #2b4159}.active{background:#346b83}#travel{width:100%;margin-top:8px;background:#395e83}@media(max-width:750px){.layout{grid-template-columns:1fr}.view{min-height:350px}canvas{height:350px}.side{display:block}}</style></head><body>
<header><h2>🚀 STARSHIP ONE</h2><span id="status">Warpantrieb ausgefallen</span></header><div class="stats" id="stats"></div><div class="layout"><div class="view"><canvas id="ship"></canvas></div><aside class="side"><b>Raumschiffverwaltung</b><p class="small">Raum auswählen, Crew zuweisen, Module bauen. Crew und Systeme arbeiten in Echtzeit.</p><div id="selection">Tippe auf einen Raum.</div><hr><b>Neues Modul</b><div id="build"></div><hr><b>Crew (7)</b><div id="crew"></div><hr><button id="travel">🪐 System erkunden (1 Reiseschritt)</button><p class="small" id="sector"></p><b>Bordlog</b><div id="log"></div></aside></div>
<script>
const cv=document.getElementById('ship'),ctx=cv.getContext('2d');
let resources={metall:90,energie:75,nahrung:55,forschung:0,ersatzteile:0},step=0,selected=0,mode='',tick=0;
let rooms=[{x:0,y:0,type:'Brücke'},{x:1,y:0,type:'Energiekern'},{x:-1,y:0,type:'Hydroponik'},{x:0,y:1,type:'Krankenstation'},{x:1,y:1,type:'Werkstatt'},{x:-1,y:1,type:'Forschung'}];
let crew=[['Mara','Pilotin','Brücke'],['Elias','Botaniker','Hydroponik'],['Nia','Botanikerin','Hydroponik'],['Dr. Kim','Medizinerin','Krankenstation'],['Alex','Techniker','Energiekern'],['Sam','Technikerin','Werkstatt'],['Rin','Waffenspezialist','Forschung']].map((a,i)=>({name:a[0],role:a[1],job:a[2],room:i===2?2:i===6?5:i===5?4:i===4?1:i===3?3:i===1?2:0}));
const icons={'Brücke':'🕹️','Energiekern':'⚡','Hydroponik':'🌱','Krankenstation':'✚','Werkstatt':'🔧','Forschung':'🔬','Waffenraum':'🎯','Lager':'📦'};
const costs={'Hydroponik':20,'Werkstatt':25,'Forschung':30,'Waffenraum':35,'Lager':15,'Krankenstation':25};
function log(t){document.getElementById('log').innerHTML='<p>› '+t+'</p>'+document.getElementById('log').innerHTML}
function renderUI(){document.getElementById('stats').innerHTML=Object.entries(resources).map(([k,v])=>`<span>${k}: <b>${Math.floor(v)}</b></span>`).join('');
document.getElementById('selection').innerHTML=selected!==null?`<p><b>${icons[rooms[selected].type]} ${rooms[selected].type}</b></p><p class="small">Personal: ${crew.filter(c=>c.room===selected).map(c=>c.name).join(', ')||'unbesetzt'}</p>`:'<p>Freien Bauplatz auswählen.</p>';
document.getElementById('build').innerHTML=Object.entries(costs).map(([k,v])=>`<button onclick="build('${k}')">${icons[k]} ${k} (${v} Metall)</button>`).join('');
document.getElementById('crew').innerHTML=crew.map((c,i)=>`<div class="crew"><b>${c.name}</b> · ${c.role}<br><select onchange="assign(${i},this.value)">${rooms.map((r,j)=>`<option value="${j}" ${j===c.room?'selected':''}>${r.type} ${j+1}</option>`).join('')}</select></div>`).join('');
document.getElementById('sector').textContent='Erkundungsschritt: '+step+' · Warp-Reparatur: '+Math.min(100,Math.floor(resources.ersatzteile/5*100))+'% (5 Ersatzteile nötig)'}
function assign(i,v){crew[i].room=+v;renderUI()}
let buildType='';function build(type){if(resources.metall<costs[type])return log('Nicht genug Metall.');buildType=type;log('Freies Feld am Schiff antippen, um '+type+' zu bauen.')}
function resize(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;draw()}
function layout(){let s=Math.min(cv.width/6,cv.height/5,110*devicePixelRatio);return {s,cx:cv.width/2,cy:cv.height/2}}
function draw(){let {s,cx,cy}=layout();ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#091422';ctx.fillRect(0,0,cv.width,cv.height);for(let i=0;i<65;i++){let x=(i*7919%997)/997*cv.width,y=(i*4253%991)/991*cv.height;ctx.fillStyle='#6486aa';ctx.fillRect(x,y,2,2)}
ctx.save();ctx.translate(cx,cy);ctx.transform(1,0,-.22,.75,0,0);rooms.forEach((r,i)=>{let x=r.x*s,y=r.y*s;ctx.fillStyle=i===selected?'#356c83':'#19384c';ctx.strokeStyle='#79abc6';ctx.lineWidth=3*devicePixelRatio;ctx.fillRect(x-s*.46,y-s*.46,s*.92,s*.92);ctx.strokeRect(x-s*.46,y-s*.46,s*.92,s*.92);ctx.fillStyle='#dceefa';ctx.textAlign='center';ctx.font=`${Math.max(12,s*.25)}px system-ui`;ctx.fillText(icons[r.type],x,y);ctx.font=`${Math.max(9,s*.12)}px system-ui`;ctx.fillText(r.type,x,y+s*.25);crew.filter(c=>c.room===i).forEach((c,j)=>{ctx.fillStyle=['#f8c976','#7ce4c8','#d6a6ef'][j%3];ctx.beginPath();ctx.arc(x-s*.25+j*s*.15,y-s*.3,s*.05,0,7);ctx.fill()})});ctx.restore()}
cv.addEventListener('click',e=>{let {s,cx,cy}=layout(),x=(e.offsetX*devicePixelRatio-cx),y=(e.offsetY*devicePixelRatio-cy)/.75;x+=.22*y;let gx=Math.round(x/s),gy=Math.round(y/s);if(Math.abs(x-gx*s)>s*.46||Math.abs(y-gy*s)>s*.46)return;let i=rooms.findIndex(r=>r.x===gx&&r.y===gy);if(buildType){if(i>=0)return log('Feld bereits belegt.');if(!rooms.some(r=>Math.abs(r.x-gx)+Math.abs(r.y-gy)===1))return log('Module müssen angrenzen.');resources.metall-=costs[buildType];rooms.push({x:gx,y:gy,type:buildType});selected=rooms.length-1;log(buildType+' gebaut.');buildType=''}else if(i>=0)selected=i;renderUI();draw()});
document.getElementById('travel').onclick=()=>{if(resources.energie<12)return log('Nicht genug Energie.');resources.energie-=12;step++;let m=12+Math.floor(Math.random()*15),f=Math.random()<.45?1:0;resources.metall+=m;resources.ersatzteile+=f;log('Sektor '+step+': '+m+' Metall geborgen'+(f?', 1 Warp-Ersatzteil gefunden.':'.'));if(resources.ersatzteile>=5)log('Warp-Reparatur möglich! Ziel des Prototyps erreicht.');renderUI()};
function simulate(){tick++;let power=crew.filter(c=>rooms[c.room]?.type==='Energiekern').length;resources.energie=Math.min(120,resources.energie+power*1.2-.5);let plants=crew.filter(c=>rooms[c.room]?.type==='Hydroponik').length;resources.nahrung=Math.min(120,resources.nahrung+plants*.55-.55);let research=crew.filter(c=>rooms[c.room]?.type==='Forschung').length;resources.forschung+=research*.25; if(resources.energie<0)resources.energie=0;if(resources.nahrung<0)resources.nahrung=0;if(tick%5===0){if(resources.nahrung===0)log('Warnung: Nahrung aufgebraucht!');if(resources.energie===0)log('Warnung: Energiekern erschöpft!')}renderUI();draw()}
log('Notfallprotokoll aktiv. Sieben Crewmitglieder gestrandet. Warp-Antrieb defekt.');renderUI();window.addEventListener('resize',resize);resize();setInterval(simulate,2000);
</script></body></html>
