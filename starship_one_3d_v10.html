<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Starship One – Warbird V1.0</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b10;color:#cdebdc;font:14px system-ui}canvas{display:block;touch-action:none}header{position:absolute;top:16px;left:18px;pointer-events:none;text-shadow:0 2px 10px #000}header strong{font-size:20px;letter-spacing:.17em}header small{display:block;margin-top:7px;opacity:.7}footer{position:absolute;bottom:16px;width:100%;text-align:center;pointer-events:none;opacity:.7}</style></head><body><header><strong>STARSHIP ONE</strong><small>V1.0 · INTEGRIERTER WARBIRD</small></header><footer>Mit einem Finger drehen · Mit zwei Fingern zoomen</footer><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030b10);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,700);camera.position.set(28,19,-33);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=17;controls.maxDistance=95;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0x8bbfb2,0x0a171b,2.4));
const a=new THREE.DirectionalLight(0xe8ffef,3.5);a.position.set(-14,25,-15);scene.add(a);
const b=new THREE.DirectionalLight(0x21e5ac,2.2);b.position.set(15,-9,18);scene.add(b);
const metal=new THREE.MeshStandardMaterial({color:0x45695f,metalness:.72,roughness:.31,side:THREE.DoubleSide});
const dark=new THREE.MeshStandardMaterial({color:0x16332f,metalness:.78,roughness:.33,side:THREE.DoubleSide});
const ridge=new THREE.MeshStandardMaterial({color:0x77998a,metalness:.8,roughness:.24,side:THREE.DoubleSide});
const light=new THREE.MeshStandardMaterial({color:0x5affbc,emissive:0x00df87,emissiveIntensity:3.2});
const ship=new THREE.Group();scene.add(ship);
// Each wing is a single, smoothly varying loft surface with a rounded outer edge.
// Both upper and lower wing decks are part of a recognizable D'deridex-inspired double-hull design.
// Z negative = bow, positive = stern.
function wing(s,deck,material){
 const n=96,m=28,verts=[],uv=[],idx=[];
 for(let i=0;i<=n;i++){
  const t=i/n;
  // The inner root begins inside the hull and grows continuously into
  // a swept, outward-flaring wing; there is no narrow attachment stalk.
  const root=0.55+14.8*Math.sin(Math.PI*.51*t);
  const cz=10.1-22.1*t+2.1*Math.sin(Math.PI*t);
  const width=4.65*Math.pow(1-t,.62)+.025;
  for(let j=0;j<=m;j++){
   const q=j/m;
   const x=s*(root+q*width);
   const z=cz+(q-.5)*width*.45;
   const smooth=Math.sin(Math.PI*q);
   // Upper and lower wing shells retain the Warbird's open central void.
   // At the stern they merge organically into the central fuselage.
   const y=deck*(2.0+1.5*Math.sin(Math.PI*t)+.32*smooth)
       -.35*Math.sin(Math.PI*t)*q
       +deck*.32*Math.exp(-Math.pow((x-3.0)/4.0,2));
   verts.push(x,y,z);uv.push(t,q);
  }
 }
 for(let i=0;i<n;i++)for(let j=0;j<m;j++){
  const k=i*(m+1)+j;idx.push(k,k+m+1,k+1,k+1,k+m+1,k+m+2);
 }
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();ship.add(new THREE.Mesh(g,material));
}
for(const s of [-1,1]){wing(s,1,metal);wing(s,-1,metal)}
// Organic central body: ellipsoids are intentionally overlapped inside the wing-root region,
// leaving the characteristic negative space between upper and lower swept wings.
function ell(x,y,z,sx,sy,sz,mat){const mesh=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),mat);mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);ship.add(mesh);return mesh}
ell(0,0,6.3,6.2,3.15,6.4,metal);
ell(0,0,-4.3,2.9,2.2,6.7,metal);
ell(0,.5,-9.0,1.65,1.15,3.5,ridge);
ell(0,.95,-10.7,.7,.34,1.9,dark);
// Central spine arches over the opening, but the wings remain distinctly separated.
function tube(points,r,mat){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,70,r,10,false),mat);ship.add(mesh)}
for(const s of [-1,1]){
 tube([[s*3.2,2.95,10.0],[s*6.8,3.1,7.4],[s*11.5,3.4,2.5],[s*15.3,2.7,-3.3],[s*16.1,1.7,-8.0]],.14,ridge);
 tube([[s*3.2,-2.95,10.0],[s*6.8,-3.1,7.4],[s*11.5,-3.4,2.5],[s*15.3,-2.7,-3.3],[s*16.1,-1.7,-8.0]],.12,dark);
 tube([[s*4.7,3.0,8.2],[s*8.8,3.4,5.1],[s*13.0,3.5,-.6],[s*15.9,1.8,-7.2]],.085,light);
 
 
}
// Nose bridge and rear luminous engine line
ell(0,0,-11.3,1.1,.65,1.4,dark);
ell(0,0,12.0,2.4,.45,.22,light);
const stars=new THREE.BufferGeometry(),positions=[];for(let i=0;i<1800;i++){let r=100+Math.random()*220,a=Math.random()*Math.PI*2,z=Math.random()*2-1,v=Math.sqrt(1-z*z);positions.push(r*v*Math.cos(a),r*z,r*v*Math.sin(a))}stars.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xa3c4c4,size:.45,sizeAttenuation:false})));
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
