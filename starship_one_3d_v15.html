<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starship One – V1.5</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030910;color:#e2f5ee;font:14px system-ui}canvas{display:block;touch-action:none}#hud{position:absolute;left:16px;top:14px;pointer-events:none;text-shadow:0 2px 8px black}#hud strong{letter-spacing:.16em;font-size:19px}#hud small{display:block;margin-top:5px;color:#a8c6bc}#help{position:absolute;bottom:15px;text-align:center;width:100%;pointer-events:none;color:#b8d5ce}#err{position:absolute;top:75px;left:16px;right:16px;color:#ffc6a8;white-space:pre-wrap}</style></head><body><div id="hud"><strong>STARSHIP ONE</strong><small>V1.5 · RUNDES HECK</small></div><div id="help">Mit einem Finger drehen · Mit zwei Fingern zoomen</div><div id="err"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x030910);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,400);camera.position.set(24,17,-32);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.minDistance=14;orbit.maxDistance=85;orbit.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0x9bd6c7,0x07121c,2.5));
const key=new THREE.DirectionalLight(0xf3fff9,3.2);key.position.set(-10,18,-13);scene.add(key);
const rim=new THREE.DirectionalLight(0x4bd9b4,2.0);rim.position.set(12,-6,16);scene.add(rim);
const hullMat=new THREE.MeshStandardMaterial({color:0x648a7e,metalness:.72,roughness:.32,side:THREE.DoubleSide});
const darkMat=new THREE.MeshStandardMaterial({color:0x163c38,metalness:.8,roughness:.3});
const glowMat=new THREE.MeshStandardMaterial({color:0x4affb3,emissive:0x11e68e,emissiveIntensity:2.5});
const ship=new THREE.Group();scene.add(ship);
// A closed organic hull made as ONE continuous surface, not separate polygon plates.
// Outline is defined on the right, from the nose toward the stern, then mirrored.
const right=[
[0,-15],[1.15,-14.5],[2.2,-13.0],[3.05,-10.5],[3.35,-7.5],
[3.55,-4.0],[4.6,-1.0],[6.2,1.6],[8.8,3.5],[11.9,3.9],
[14.3,2.5],[16.2,-.3],[17.2,-3.6],[17.7,-7.6],
[17.0,-10.5],[15.6,-12.2],[14.8,-11.2],[15.0,-7.8],
[14.4,-4.1],[12.9,-1.0],[10.6,2.0],[8.2,5.2],
[5.5,8.7],[2.9,11.8],[0,13.2]
];
// A smooth closed spline is sampled at high resolution. The rear is broad,
// the bow tapers and the wings sweep sideways and forward.
const outline=[...right,...right.slice(1,-1).reverse().map(([x,z])=>[-x,z])];
const spline=new THREE.CatmullRomCurve3(outline.map(([x,z])=>new THREE.Vector3(x,0,z)),true,'centripetal');
const N=360,R=24,vertices=[],indices=[];
for(let side=0;side<2;side++){
 for(let ring=0;ring<=R;ring++){
  const f=ring/R;
  for(let i=0;i<N;i++){
   const q=spline.getPoint(i/N);
   const x=q.x*f,z=q.z*f;
   // Thick rounded stern, a low oval bridge, and smoothly tapering wing edges.
   const aft=2.65*Math.exp(-Math.pow((z-6.7)/8.2,2))*Math.exp(-Math.pow(x/11.8,2));
   const bridge=.85*Math.exp(-Math.pow((z+7.8)/4.7,2))*Math.exp(-Math.pow(x/3.2,2));
   const wing=.75*Math.exp(-Math.pow((Math.abs(x)-11)/7.8,2));
   const round=Math.sqrt(Math.max(0,1-f*f));
   const y=(side===0?1:-1)*(0.12+1.1*round+aft+bridge+wing*.6);
   vertices.push(x,y,z);
  }
 }
}
const stride=(R+1)*N;
for(let side=0;side<2;side++)for(let ring=0;ring<R;ring++)for(let i=0;i<N;i++){
 const a=side*stride+ring*N+i,b=side*stride+ring*N+(i+1)%N,c=a+N,d=b+N;
 if(side===0)indices.push(a,b,c,b,d,c);else indices.push(a,c,b,b,c,d);
}
for(let i=0;i<N;i++){
 const j=(i+1)%N,a=R*N+i,b=R*N+j,c=stride+R*N+i,d=stride+R*N+j;
 indices.push(a,c,b,b,c,d);
}
const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geom.setIndex(indices);geom.computeVertexNormals();
ship.add(new THREE.Mesh(geom,hullMat));
function ell(x,y,z,sx,sy,sz,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(1,48,24),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);ship.add(m)}
// Low egg-shaped bridge blended visually into the raised central upper hull.
ell(0,1.32,-7.7,2.2,.34,3.4,darkMat);
ell(0,1.61,-8.6,1.1,.09,1.5,glowMat);
function trace(coords,rad,mat){const path=new THREE.CatmullRomCurve3(coords.map(p=>new THREE.Vector3(...p)));ship.add(new THREE.Mesh(new THREE.TubeGeometry(path,100,rad,7,false),mat))}
for(const s of [-1,1]){
 trace([[s*3.8,2.0,7],[s*7.4,1.5,4.2],[s*11.6,1.2,2.3],[s*15.4,.65,-3],[s*16.3,.35,-8.4]],.065,glowMat);
}
ell(0,.25,12.9,1.7,.28,.18,glowMat);
const starGeo=new THREE.BufferGeometry(),stars=[];for(let i=0;i<1000;i++){const r=90+Math.random()*140,az=Math.random()*Math.PI*2,v=Math.random()*2-1,rad=Math.sqrt(1-v*v);stars.push(r*rad*Math.cos(az),r*v,r*rad*Math.sin(az))}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xb3d8d1,size:.6,sizeAttenuation:false})));
function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){document.getElementById('err').textContent='3D-Fehler: '+e.message;console.error(e)}
</script></body></html>
