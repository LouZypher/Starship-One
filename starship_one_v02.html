<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starship One 0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#07101b;color:#e6f2ff;font:14px system-ui}header{padding:12px;background:#12243b;display:flex;justify-content:space-between;align-items:center;gap:8px}button,select{background:#234564;color:white;border:1px solid #527b9d;border-radius:6px;padding:8px;margin:3px}button.active{background:#398f9c}main{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:10px;padding:10px}canvas{width:100%;height:570px;display:block;touch-action:manipulation;border:1px solid #37536e;border-radius:12px;background:#081523}aside{background:#132238;padding:12px;border-radius:12px}#log{max-height:130px;overflow:auto;font-size:12px;color:#b9d4e6}.stats{display:flex;gap:15px;padding:8px;overflow:auto;white-space:nowrap}.crew{border-bottom:1px solid #354a62;padding:6px 0}small{color:#a9c5d9}@media(max-width:760px){main{grid-template-columns:1fr}canvas{height:400px}}</style></head><body><header><b>🚀 STARSHIP ONE · V0.2</b><button onclick="overview()">🌌 Gesamtansicht</button></header><div class="stats" id="stats"></div><main><div><canvas id="canvas"></canvas><p><small>Tippe in der Gesamtansicht auf einen Schiffsteil. In der Innenansicht kannst du Räume und Crew auswählen.</small></p></div><aside><h3 id="heading">Schiffsübersicht</h3><div id="detail">Wähle einen Schiffsteil.</div><hr><b>Crew & Befehle</b><div id="crew"></div><hr><button onclick="travel()">🪐 System erkunden</button><p id="sector"></p><b>Bordlog</b><div id="log"></div></aside></main><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let zone=null,chosen=null,metal=95,energy=90,food=70,research=0,parts=0,steps=0,frame=0;
const areas=[{id:'saucer',name:'Untertassensektion',x:0,y:-120},{id:'hull',name:'Verbindungsrumpf',x:0,y:20},{id:'engine',name:'Maschinensektion',x:0,y:115},{id:'left',name:'Warpgondel links',x:-145,y:125},{id:'right',name:'Warpgondel rechts',x:145,y:125}];
const rooms={saucer:[['Brücke','🕹️'],['Forschung','🔬'],['Krankenstation','✚'],['Hydroponik','🌱'],['Freier Raum','＋'],['Freier Raum','＋']],hull:[['Korridor','↕'],['Lager','📦'],['Freier Raum','＋']],engine:[['Energiekern','⚡'],['Werkstatt','🔧'],['Maschinenraum','⚙️'],['Freier Raum','＋']],left:[['Warpantrieb links','⚡'],['Wartung','🔧'],['Freier Raum','＋']],right:[['Warpantrieb rechts','⚡'],['Wartung','🔧'],['Freier Raum','＋']]};
let crew=[['Mara','Pilotin','saucer',0],['Elias','Botaniker','saucer',3],['Nia','Botanikerin','saucer',3],['Dr. Kim','Medizinerin','saucer',2],['Alex','Techniker','engine',0],['Sam','Technikerin','engine',1],['Rin','Waffenspezialist','saucer',1]].map(([name,role,area,room])=>({name,role,area,room,goal:null,progress:0}));
function log(s){document.getElementById('log').innerHTML='<p>› '+s+'</p>'+document.getElementById('log').innerHTML}
function overview(){zone=null;chosen=null;render()}
function enter(id){zone=id;chosen=null;render()}
function choose(i){chosen=i;render()}
function polygon(points,fill,stroke='#76a8c9'){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);ctx.strokeStyle='#7babc4';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h)}
function label(t,x,y,size=12){ctx.fillStyle='#f2f9ff';ctx.textAlign='center';ctx.font=`${size}px system-ui`;ctx.fillText(t,x,y)}
function dims(){return {w:canvas.width,h:canvas.height,scale:Math.min(canvas.width/650,canvas.height/490)}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);let {w,h,scale}=dims();ctx.fillStyle='#09182b';ctx.fillRect(0,0,w,h);for(let i=0;i<80;i++){ctx.fillStyle='#567b9a';ctx.fillRect((i*7129%997)/997*w,(i*4177%991)/991*h,1.5,1.5)}ctx.save();ctx.translate(w/2,h/2);ctx.scale(scale,scale);
if(!zone){ctx.save();ctx.translate(0,5);
polygon([[-36,-85],[36,-85],[48,140],[-48,140]],'#38556c');
polygon([[-110,75],[-132,100],[-150,145],[-165,145],[-110,30]],'#58738a');polygon([[110,75],[132,100],[150,145],[165,145],[110,30]],'#58738a');
rect(-190,10,65,235,'#385e78');rect(125,10,65,235,'#385e78');rect(-197,10,79,30,'#80b5d4');rect(118,10,79,30,'#80b5d4');
polygon([[-65,60],[65,60],[75,175],[-75,175]],'#506f84');
ctx.beginPath();ctx.ellipse(0,-117,135,104,0,0,Math.PI*2);ctx.fillStyle='#607f96';ctx.fill();ctx.strokeStyle='#a4cee1';ctx.lineWidth=5;ctx.stroke();ctx.beginPath();ctx.ellipse(0,-117,100,75,0,0,Math.PI*2);ctx.strokeStyle='#3b627c';ctx.stroke();rect(-27,-147,54,25,'#25465e');
label('BRÜCKE',0,-131);label('UNTERTASSE',0,-70);label('RUMPF',0,4);label('MASCHINEN',0,116);label('WARP L',-158,170);label('WARP R',158,170);ctx.restore();
}else{let rs=rooms[zone];label(areas.find(a=>a.id===zone).name,0,-190,21);let cols=zone==='saucer'?3:zone==='hull'?1:2;let cellW=zone==='hull'?170:150,cellH=105;let rows=Math.ceil(rs.length/cols);let startX=-cols*cellW/2,startY=-rows*cellH/2;
rs.forEach(([name,ico],i)=>{let col=i%cols,row=Math.floor(i/cols),x=startX+col*cellW,y=startY+row*cellH;rect(x+4,y+4,cellW-8,cellH-8,i===chosen?'#3a8191':'#26475c');label(ico,x+cellW/2,y+42,25);label(name,x+cellW/2,y+70,12);let present=crew.filter(c=>c.area===zone&&c.room===i);present.forEach((c,j)=>{let xx=x+25+j*22,yy=y+84;ctx.fillStyle='#ffc979';ctx.beginPath();ctx.arc(xx,yy,7,0,Math.PI*2);ctx.fill()})});
ctx.strokeStyle='#6e98ad';ctx.lineWidth=5;ctx.strokeRect(startX-9,startY-9,cols*cellW+18,rows*cellH+18);
}ctx.restore()}
function hit(e){let b=canvas.getBoundingClientRect(),x=(e.clientX-b.left)*canvas.width/b.width,y=(e.clientY-b.top)*canvas.height/b.height,{w,h,scale}=dims();x=(x-w/2)/scale;y=(y-h/2)/scale;if(!zone){if(x*x/135**2+(y+112)**2/104**2<1)return enter('saucer');if(x< -115&&y>0&&y<245)return enter('left');if(x>115&&y>0&&y<245)return enter('right');if(Math.abs(x)<78&&y>60&&y<185)return enter('engine');if(Math.abs(x)<60&&y<80&&y>-85)return enter('hull')}else{let rs=rooms[zone],cols=zone==='saucer'?3:zone==='hull'?1:2,cw=zone==='hull'?170:150,ch=105,rows=Math.ceil(rs.length/cols),sx=-cols*cw/2,sy=-rows*ch/2,col=Math.floor((x-sx)/cw),row=Math.floor((y-sy)/ch),i=row*cols+col;if(col>=0&&col<cols&&row>=0&&row<rows&&i<rs.length)choose(i)}}
canvas.addEventListener('click',hit);
function build(){if(chosen===null||rooms[zone][chosen][0]!=='Freier Raum')return;if(metal<25)return log('Nicht genug Metall.');let type=document.getElementById('buildtype').value;rooms[zone][chosen]=[type,({'Hydroponik':'🌱','Werkstatt':'🔧','Forschung':'🔬','Lager':'📦','Krankenstation':'✚','Waffenraum':'🎯'})[type]];metal-=25;log(type+' in '+areas.find(a=>a.id===zone).name+' gebaut.');render()}
function order(i){let val=document.getElementById('order'+i).value,[a,r]=val.split(':');crew[i].goal={area:a,room:+r};crew[i].progress=0;log('Befehl an '+crew[i].name+': '+rooms[a][+r][0]);render()}
function render(){document.getElementById('stats').innerHTML=`🔩 Metall ${Math.floor(metal)} &nbsp; ⚡ Energie ${Math.floor(energy)} &nbsp; 🌱 Nahrung ${Math.floor(food)} &nbsp; 🔬 Forschung ${Math.floor(research)} &nbsp; 🛠️ Warpteile ${parts}/5`;
document.getElementById('heading').textContent=zone?areas.find(a=>a.id===zone).name:'Schiffsübersicht';
document.getElementById('detail').innerHTML=zone?(chosen===null?'<p>Wähle einen Raum.</p>':`<p><b>${rooms[zone][chosen][0]}</b></p>`+(rooms[zone][chosen][0]==='Freier Raum'?'<select id="buildtype">'+['Hydroponik','Werkstatt','Forschung','Lager','Krankenstation','Waffenraum'].map(t=>`<option>${t}</option>`).join('')+'</select><button onclick="build()">Bauen (25 Metall)</button>':'<small>Raum betriebsbereit</small>')):'<p>Tippe auf Untertasse, Rumpf, Maschinensektion oder eine Warpgondel.</p>';
document.getElementById('crew').innerHTML=crew.map((c,i)=>`<div class="crew"><b>${c.name}</b> · ${c.role}<br><small>${rooms[c.area][c.room][0]}${c.goal?' → unterwegs':''}</small><br><select id="order${i}">${Object.entries(rooms).flatMap(([a,rs])=>rs.map((r,j)=>`<option value="${a}:${j}">${areas.find(v=>v.id===a).name}: ${r[0]}</option>`)).join('')}</select><button onclick="order(${i})">Befehl</button></div>`).join('');
document.getElementById('sector').textContent='Sektor '+steps+' · Warp-Reparatur '+Math.round(parts/5*100)+'%';draw()}
function travel(){if(energy<12)return log('Zu wenig Energie.');energy-=12;steps++;let gain=10+Math.floor(Math.random()*18);metal+=gain;let part=Math.random()<.55?1:0;parts=Math.min(5,parts+part);log('Sektor '+steps+': '+gain+' Metall'+(part?', Warpteil geborgen.':'.'));if(parts===5)log('Alle Warp-Ersatzteile gefunden!');render()}
function simulate(){frame++;crew.forEach(c=>{if(c.goal){c.progress++;if(c.progress>=3){c.area=c.goal.area;c.room=c.goal.room;c.goal=null;log(c.name+' hat das Ziel erreicht.')}}else{if(frame%9===0&&Math.random()<.2){let rs=rooms[c.area];let dest=rs.findIndex((r,i)=>i!==c.room&&r[0]!=='Freier Raum');if(dest>=0)c.goal={area:c.area,room:dest},c.progress=0}}});let plant=crew.filter(c=>!c.goal&&rooms[c.area][c.room][0]==='Hydroponik').length;let tech=crew.filter(c=>!c.goal&&rooms[c.area][c.room][0]==='Energiekern').length;let sci=crew.filter(c=>!c.goal&&rooms[c.area][c.room][0]==='Forschung').length;food=Math.max(0,Math.min(130,food+plant*.45-.5));energy=Math.max(0,Math.min(130,energy+tech*.8-.3));research+=sci*.2;render()}
function resize(){let d=devicePixelRatio||1;canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;draw()}window.addEventListener('resize',resize);log('Schiff gestrandet. Warp-Antrieb ausgefallen.');render();resize();setInterval(simulate,2500);
</script></body></html>
