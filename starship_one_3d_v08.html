<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Starship One 3D · V0.8</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030813;color:#e5f5ff;font:14px system-ui}canvas{display:block;touch-action:none}.hud{position:absolute;top:16px;left:18px;pointer-events:none;text-shadow:0 2px 9px #000}.hud b{font-size:20px;letter-spacing:.17em}.hud small{display:block;color:#a2c4d7;margin-top:7px}.hint{position:absolute;bottom:17px;width:100%;text-align:center;color:#b6d6e7;pointer-events:none}</style></head><body><div class="hud"><b>STARSHIP ONE</b><small>V0.8 · MONOCOQUE DESIGN · AUSSENANSICHT</small></div><div class="hint">Drehen: ziehen · Zoomen: zwei Finger</div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x030813);const camera=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,500);camera.position.set(22,18,29);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0xb7e0ff,0x06101c,2.4));let key=new T.DirectionalLight(0xffffff,3.1);key.position.set(-12,20,-8);scene.add(key);let fill=new T.DirectionalLight(0x49baff,1.5);fill.position.set(15,-7,12);scene.add(fill);
const ship=new T.Group();scene.add(ship);
const skin=new T.MeshStandardMaterial({color:0x7798ac,metalness:.75,roughness:.29,side:T.DoubleSide,flatShading:false});
const luminous=new T.MeshStandardMaterial({color:0x4ccfff,emissive:0x0099ff,emissiveIntensity:2.6});
const dark=new T.MeshStandardMaterial({color:0x21384a,metalness:.85,roughness:.22});
// A single continuous silhouette combines the breast, torso and two forward-swept crescent wings.
// Negative Z is forward; the stern is at positive Z.
const half=[
 [0,-14.9],[2.3,-14.2],[4.7,-12.1],[6.8,-9.3],[8.1,-5.5],[8.0,-2.0],
 [6.4,1.4],[4.5,4.0],[4.8,6.1],[7.5,7.5],[11.2,7.4],
 [14.3,5.2],[16.5,1.8],[17.4,-2.6],[16.8,-7.0],[14.9,-10.4],
 [13.0,-12.4],[12.0,-12.8],[12.8,-9.4],[13.2,-5.1],[12.6,-1.0],
 [10.7,2.4],[8.1,4.1],[6.0,3.1],[5.1,.8],[4.5,-2.3],
 [3.4,-4.1],[2.5,-3.5],[2.2,.8],[2.6,5.5],[3.5,9.5],
 [2.4,12.6],[0,13.4]
];
// Outline from forward center, along right perimeter and inward crescent, ending at aft center.
// Mirror around x=0 for an uninterrupted single shape.
const outline=[...half,...half.slice(1,-1).reverse().map(([x,z])=>[-x,z])];
const shape=new T.Shape();shape.moveTo(outline[0][0],-outline[0][1]);for(let i=1;i<outline.length;i++)shape.lineTo(outline[i][0],-outline[i][1]);shape.closePath();
// Dense triangulated surface through extruded geometry with smooth bevel.
const geom=new T.ExtrudeGeometry(shape,{depth:1.2,steps:1,bevelEnabled:true,bevelSegments:4,bevelThickness:.38,bevelSize:.32,curveSegments:14});
geom.rotateX(-Math.PI/2);
// Shape coords used -z, rotation makes forward negative Z.
const pos=geom.attributes.position;
for(let i=0;i<pos.count;i++){
 let x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
 // Continuous raised breastbone, tapering smoothly into wing roots.
 let breast=2.15*Math.exp(-((x/5.5)**2+((z+4.6)/8.0)**2));
 let spine=.6*Math.exp(-((x/3.2)**2+((z-4)/9)**2));
 let wingDrop=-.85*Math.min(1,Math.max(0,(Math.abs(x)-5)/9));
 pos.setY(i,y+breast+spine+wingDrop);
}
geom.computeVertexNormals();
let hull=new T.Mesh(geom,skin);ship.add(hull);
// Embedded glow details are subtle overlays, not separate structural blocks.
function tube(points,r,material){const curve=new T.CatmullRomCurve3(points.map(v=>new T.Vector3(...v)));let m=new T.Mesh(new T.TubeGeometry(curve,65,r,8,false),material);ship.add(m)}
for(const s of [-1,1]){
 tube([[s*4.9,1.15,6.4],[s*9.1,.55,6.7],[s*13.6,-.15,3.3],[s*15.7,-.45,-2.3],[s*14.7,-.55,-8.1]],.07,luminous);
 tube([[s*2.2,2.55,-10.1],[s*3.4,2.65,-7.6],[s*4.1,2.4,-4.7]],.055,luminous);
}
const cockpit=new T.Mesh(new T.SphereGeometry(1,40,20),dark);cockpit.position.set(0,3.15,-7.2);cockpit.scale.set(1.5,.28,2.6);ship.add(cockpit);
const engine=new T.Mesh(new T.SphereGeometry(1,32,16),luminous);engine.position.set(0,.15,13.5);engine.scale.set(1.25,.26,.19);ship.add(engine);
const stars=new T.BufferGeometry(),data=[];for(let i=0;i<1300;i++){let r=120+Math.random()*250,a=Math.random()*6.283,b=Math.acos(Math.random()*2-1);data.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}stars.setAttribute('position',new T.Float32BufferAttribute(data,3));scene.add(new T.Points(stars,new T.PointsMaterial({color:0xc8ddf3,size:.6,sizeAttenuation:false})));
let yaw=.6,pitch=.45,dist=43;let touches=new Map(),pinch=0;
renderer.domElement.addEventListener('pointerdown',e=>{touches.set(e.pointerId,[e.clientX,e.clientY]);renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;let old=touches.get(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===1){yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.48,Math.min(1.48,pitch+(e.clientY-old[1])*.009))}else{let v=[...touches.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);if(pinch)dist=Math.max(17,Math.min(95,dist+(pinch-d)*.07));pinch=d}});
function end(e){touches.delete(e.pointerId);pinch=0}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(17,Math.min(95,dist+e.deltaY*.025))},{passive:true});
function animate(){requestAnimationFrame(animate);camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(0,0,0);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
