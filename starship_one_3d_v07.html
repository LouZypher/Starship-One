<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Starship One · 0.7</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#020713;color:#c9e8fa;font:14px system-ui}canvas{display:block;touch-action:none}#hud{position:absolute;top:16px;left:18px;pointer-events:none}h1{font-size:18px;letter-spacing:.24em;margin:0 0 6px}small{opacity:.7}#tip{position:absolute;bottom:20px;width:100%;text-align:center;opacity:.7;pointer-events:none}</style></head><body><div id="hud"><h1>STARSHIP ONE</h1><small>DESIGNSTUDIE · V0.7 · AUSSENANSICHT</small></div><div id="tip">Ziehen: drehen · Zwei Finger: zoomen</div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x020713);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);camera.position.set(18,14,24);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new T.HemisphereLight(0x94c6ff,0x07111e,2));let light=new T.DirectionalLight(0xe6f5ff,3.5);light.position.set(-7,14,10);scene.add(light);let rim=new T.DirectionalLight(0x39caff,2);rim.position.set(8,-5,-12);scene.add(rim);
const ship=new T.Group();scene.add(ship);const hull=new T.MeshStandardMaterial({color:0x617b92,metalness:.78,roughness:.28,side:T.DoubleSide}),armor=new T.MeshStandardMaterial({color:0x233e55,metalness:.83,roughness:.3,side:T.DoubleSide}),edge=new T.MeshStandardMaterial({color:0xa6c6d4,metalness:.9,roughness:.2}),glow=new T.MeshStandardMaterial({color:0x39cfff,emissive:0x00aaff,emissiveIntensity:2.8,metalness:.25,roughness:.25});
function ell(x,y,z,sx,sy,sz,mat){let m=new T.Mesh(new T.SphereGeometry(1,48,24),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);ship.add(m);return m}
function shape(points,y,depth,mat){let s=new T.Shape();s.moveTo(...points[0]);for(let i=1;i<points.length;i++)s.lineTo(...points[i]);s.closePath();let g=new T.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelThickness:.18,bevelSize:.22,bevelSegments:3,steps:1});g.rotateX(Math.PI/2);let m=new T.Mesh(g,mat);m.position.y=y;ship.add(m);return m}
// Forward direction is negative Z. Broad organic breast and tapered bow.
ell(0,.6,-2.5,5.1,1.15,5.9,hull);ell(0,1.05,-2.4,3.15,1.4,4.15,armor);
ell(0,.35,3.6,2.6,1.25,5.2,hull);ell(0,.9,-4.1,2.35,.85,2.8,edge);
shape([[-3.4,-4.4],[-4.8,-2.2],[-4.7,1.3],[-2.3,5.6],[0,7.8],[2.3,5.6],[4.7,1.3],[4.8,-2.2],[3.4,-4.4]],-.15,.65,hull);
// Scimitar wings extend from the rear hull, sweep forward and taper.
for(const s of [-1,1]){const P=[[s*1.9,5.1],[s*4.3,5.6],[s*7.2,3.2],[s*10.4,-1.8],[s*11.2,-6.1],[s*9.9,-8.4],[s*8.4,-4.8],[s*6.1,-1.4],[s*3.5,1.4]];shape(P,-.75,.85,hull);
shape([[s*2.6,4.7],[s*4.6,4.7],[s*7.8,.9],[s*10.2,-5.9],[s*8.7,-3.9],[s*5.7,.3]],-.9,.12,armor);
ell(s*4.1,-.7,4.6,1,.65,2.1,armor);ell(s*4.1,-.72,6.1,.75,.35,.23,glow);
let line=new T.Mesh(new T.BoxGeometry(.1,.055,5.6),glow);line.position.set(s*6.1,-.48,1.7);line.rotation.y=s*.53;ship.add(line)}
for(let i=-3;i<=3;i++){let w=ell(i*.7,1.66,-4.0,.19,.035,.46,glow);w.rotation.y=i*.06}
ell(0,1.85,-2.9,.65,.2,1.3,glow);
for(let s of [-1,1]){let m=ell(s*2.1,.45,-5.8,.55,.2,1.6,armor);m.rotation.y=s*.4}
const stars=new T.BufferGeometry(),coords=[];for(let i=0;i<1200;i++){let r=90+Math.random()*110,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);coords.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}stars.setAttribute('position',new T.Float32BufferAttribute(coords,3));scene.add(new T.Points(stars,new T.PointsMaterial({color:0x9fb9d5,size:.35})));
let yaw=-.3,pitch=.4,dist=32,down=false,lastX=0,lastY=0,lastD=0;
renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;yaw+=(e.clientX-lastX)*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-lastY)*.008));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(15,Math.min(65,dist+e.deltaY*.025))},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(lastD)dist=Math.max(15,Math.min(65,dist+(lastD-d)*.045));lastD=d}} ,{passive:true});renderer.domElement.addEventListener('touchend',()=>lastD=0);
function render(){requestAnimationFrame(render);camera.position.set(dist*Math.sin(yaw)*Math.cos(pitch),dist*Math.sin(pitch),dist*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(0,0,0);renderer.render(scene,camera)}render();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
